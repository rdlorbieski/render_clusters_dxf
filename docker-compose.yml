services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dxf-render-api:latest
    container_name: trem-visao
    restart: always
    expose:
      - "8000"
    networks:
      - edge
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Render de DXFs grandes pode usar ~1-2 GB transitoriamente
          memory: 4G
        reservations:
          memory: 512M

networks:
  edge:
    external: true
