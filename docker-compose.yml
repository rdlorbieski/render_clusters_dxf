services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dxf-render-api:latest
    container_name: dxf-render-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Credenciais R2 — todas vêm do .env (NÃO commitar)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-trem}
      R2_BASE_URL: ${R2_BASE_URL:-}
      # uvicorn
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    env_file:
      - path: .env
        required: false   # .env é opcional — vars obrigatórias vêm de environment: acima
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Render de DXFs grandes pode usar ~1-2 GB transitoriamente
          memory: 4G
        reservations:
          memory: 512M
